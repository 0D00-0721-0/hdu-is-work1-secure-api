name: Work 1 security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [tests, sast, sca]
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install verified, pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Prepare reports
        run: mkdir -p reports
      - name: API security and regression tests
        if: matrix.check == 'tests'
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Bandit SAST
        if: matrix.check == 'sast'
        run: bandit -r app run.py -f json -o reports/bandit.json
      - name: pip-audit SCA (runtime dependencies)
        if: matrix.check == 'sca'
        run: pip-audit -r requirements.txt --require-hashes -f json -o reports/pip-audit.json
      - name: Preserve results even if a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.check }}-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
