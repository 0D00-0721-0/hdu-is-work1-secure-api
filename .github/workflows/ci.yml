name: Work 1 security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [tests, sast, sca]
    name: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install verified, pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Prepare reports
        run: mkdir -p reports
      - name: API security and regression tests
        if: matrix.check == 'tests'
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Bandit SAST
        if: matrix.check == 'sast'
        run: bandit -r app run.py -f json -o reports/bandit.json
      - name: pip-audit SCA (runtime dependencies)
        if: matrix.check == 'sca'
        run: pip-audit -r requirements.txt --require-hashes -f json -o reports/pip-audit.json
      - name: Preserve results even if a check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.check }}-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
